name: vibeCheck

on:
  workflow_dispatch: # Manual trigger via Actions tab

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  analyze:
    # Hosted ON PURPOSE. This repo is not a fleet member: it has no entry in
    # hadoku_site's fleet-runner-coverage.json and zero runner registrations,
    # so `self-hosted,hadoku-builder` here queues forever with nothing able to
    # serve it. See allowHosted in scripts/admin/repo-policy-manifest.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: WolffM/vibecheck@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          severity_threshold: "low"
          confidence_threshold: "medium"
